name: Build, test and push docker image

on:
  push:
    branches: [dev-testing]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preveri kodo
        uses: actions/checkout@v3

      - name: Nastavi .NET 7 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Obnovi pakete
        run: dotnet restore

      - name: Prevedi rešitev
        run: dotnet build --configuration Release --no-restore

      # 6) Test + TRX
      - name: Run tests
        run: dotnet test RGIS_PrijavaVSistem/RGIS_PrijavaVSistem.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --no-build

      # 7) Upload TRX kot artefakt (uporabi v4!)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prijava v Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Zgradi in potisni sliko
        uses: docker/build-push-action@v4
        with: 
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            onlymushy/bralnidnevnik:latest
            onlymushy/bralnidnevnik:${{ github.sha }}

      - name: Deploy v Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: bralnidnevnikdev
          publish-profile: ${{ secrets.AZURE_WEBAPP_DEV_PROFILE }}
          images: onlymushy/bralnidnevnik:latest
