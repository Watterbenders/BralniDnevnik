name: Net7 Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # NAJPOMEMBNEJŠI DEL – tukaj se MORA instalirati .NET 7
    - name: Setup .NET 7 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: dotnet --info
      run: dotnet --info

    - name: Run tests
      run: dotnet test RGIS_PrijavaVSistem/RGIS_PrijavaVSistem.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"
