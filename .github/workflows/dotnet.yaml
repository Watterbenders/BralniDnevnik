name: Build, Test and Dockerize (.NET 7)

on:
  push:
  pull_request:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
    # 1) Checkout
    - name: Checkout code
      uses: actions/checkout@v4

    # 2) Install .NET 7 SDK
    - name: Setup .NET 7
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    # 3) Debug info
    - name: Show dotnet info
      run: dotnet --info

    # 4) Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 5) Build
    - name: Build project
      run: dotnet build --configuration Release --no-restore

    # 6) Run Tests (generate TRX)
    - name: Run tests
      run: dotnet test --configuration Release --logger "trx;LogFileName=test-results.trx" --no-build

    # 7) Upload TRX test results (NEW v4 — This one works)
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/test-results.trx"

    # 8) Pretty Test Report (safe for non-forks)
    - name: Test Report
      if: github.event.pull_request.head.repo.fork == false
      uses: dorny/test-reporter@v1
      with:
        name: MSTest Report
        path: "**/test-results.trx"
        reporter: dotnet-trx

    # 9) Docker build
    - name: Build Docker image
      run: docker build -t bralni-dnevnik-app .
